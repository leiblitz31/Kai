name: Build NineRouter APK (unsigned debug)

on:
  push:
    branches:
      - ninerouter-provider
  workflow_dispatch:

jobs:
  apk-debug:
    name: Build fossDebug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ninerouter-provider
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: bash ./gradlew :androidApp:assembleFossDebug --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-ninerouter-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
