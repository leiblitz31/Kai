#Kotlin — tuned for Mido 2.7GB RAM + 4GB zram (was Xmx6g/4g → OOM kill -9)
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
kotlin.incremental=true

#Gradle — tuned for Mido (was Xmx4g → OOM at compileAndroidMain)
org.gradle.jvmargs=-Xmx1536m -Xms256m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.native.ignoreDisabledTargets=true

#Android
android.nonTransitiveRClass=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
